<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metallic Cube</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #050506; overflow: hidden; }
  #scene { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  /* ------------------------------------------------------------ */
  /*  Config                                                       */
  /* ------------------------------------------------------------ */
  const CONFIG = {
    cube: {
      size: 1.4,
      color: 0xe7e9ec,
      metalness: 1,
      roughness: 0.18,
      envMapIntensity: 1.6,
      floatAmplitude: 0.18,
      floatSpeed: 0.8,
      rotationSpeed: 0.12,
    },
    tilt: { strength: 0.32, duration: 0.9 },
    camera: { parallax: 0.6, duration: 1.1 },
    hover: { scale: 1.08, glowColor: 0x8fb4ff, glowIntensity: 0.85 },
    floorY: -1.4,
  };

  /* ------------------------------------------------------------ */
  /*  Renderer / Scene / Camera                                    */
  /* ------------------------------------------------------------ */
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050506);
  scene.fog = new THREE.Fog(0x050506, 6, 16);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.4, 5.5);

  /* ------------------------------------------------------------ */
  /*  Environment — small procedural room baked to IBL, so metal   */
  /*  reflections have something varied to pick up (no HDR file)   */
  /* ------------------------------------------------------------ */
  function createEnvironment() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    const box = new THREE.BoxGeometry();
    box.deleteAttribute('uv');

    const room = new THREE.Mesh(box, new THREE.MeshStandardMaterial({ side: THREE.BackSide, color: 0x0a0a0c }));
    room.scale.set(12, 12, 12);
    envScene.add(room);

    const panelA = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    panelA.position.set(-2, 3, 2);
    panelA.scale.set(1.4, 1.4, 0.1);
    envScene.add(panelA);

    const panelB = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0x6f8cff }));
    panelB.position.set(3, -2, -3);
    panelB.scale.set(2.4, 0.15, 1.4);
    envScene.add(panelB);

    const panelC = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0xffb37a }));
    panelC.position.set(-3, -2.5, 3);
    panelC.scale.set(0.15, 2.4, 2.4);
    envScene.add(panelC);

    const rt = pmrem.fromScene(envScene, 0.04);
    pmrem.dispose();
    return rt.texture;
  }
  scene.environment = createEnvironment();

  /* ------------------------------------------------------------ */
  /*  Lighting                                                      */
  /* ------------------------------------------------------------ */
  function createLighting() {
    const hemi = new THREE.HemisphereLight(0x2a2f3a, 0x050506, 0.3);

    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(3.5, 5, 2.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    key.shadow.camera.left = -4;
    key.shadow.camera.right = 4;
    key.shadow.camera.top = 4;
    key.shadow.camera.bottom = -4;
    key.shadow.camera.far = 20;

    const fill = new THREE.DirectionalLight(0x6f8cff, 0.35);
    fill.position.set(-4, 1.5, -2);

    const rim = new THREE.SpotLight(0xffb37a, 3, 12, 0.5, 1);
    rim.position.set(-2, 4, -4);

    scene.add(hemi, key, fill, rim);
  }
  createLighting();

  /* ------------------------------------------------------------ */
  /*  Floor — soft sheen + shadow catcher                           */
  /* ------------------------------------------------------------ */
  function createFloor() {
    const geometry = new THREE.PlaneGeometry(40, 40);
    const material = new THREE.MeshStandardMaterial({
      color: 0x0b0b0d,
      roughness: 0.35,
      metalness: 0.6,
      envMapIntensity: 0.8,
    });
    const floor = new THREE.Mesh(geometry, material);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = CONFIG.floorY;
    floor.receiveShadow = true;
    scene.add(floor);
  }
  createFloor();

  /* ------------------------------------------------------------ */
  /*  Cube — nested groups: float (bob) -> tilt (cursor lean)       */
  /*  -> cube (auto-spin), so each motion owns its own axis          */
  /* ------------------------------------------------------------ */
  const floatGroup = new THREE.Group();
  const tiltGroup = new THREE.Group();
  floatGroup.add(tiltGroup);
  scene.add(floatGroup);

  const cubeGeometry = new THREE.BoxGeometry(CONFIG.cube.size, CONFIG.cube.size, CONFIG.cube.size, 1, 1, 1);
  const cubeMaterial = new THREE.MeshPhysicalMaterial({
    color: CONFIG.cube.color,
    metalness: CONFIG.cube.metalness,
    roughness: CONFIG.cube.roughness,
    envMapIntensity: CONFIG.cube.envMapIntensity,
    clearcoat: 0.4,
    clearcoatRoughness: 0.25,
    reflectivity: 1,
    emissive: new THREE.Color(CONFIG.hover.glowColor),
    emissiveIntensity: 0,
  });
  const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
  cube.castShadow = true;
  cube.receiveShadow = true;
  tiltGroup.add(cube);

  /* ------------------------------------------------------------ */
  /*  Fake mirror reflection — a faded, flipped duplicate synced     */
  /*  to the cube's world transform each frame                       */
  /* ------------------------------------------------------------ */
  function createFadeTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, size);
    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const reflectionMaterial = cubeMaterial.clone();
  reflectionMaterial.transparent = true;
  reflectionMaterial.opacity = 0.22;
  reflectionMaterial.emissiveIntensity = 0;
  reflectionMaterial.alphaMap = createFadeTexture();
  const reflectionCube = new THREE.Mesh(cubeGeometry, reflectionMaterial);
  reflectionCube.renderOrder = -1;
  scene.add(reflectionCube);

  const worldPos = new THREE.Vector3();
  const worldQuat = new THREE.Quaternion();
  function syncReflection() {
    cube.getWorldPosition(worldPos);
    cube.getWorldQuaternion(worldQuat);
    reflectionCube.position.set(worldPos.x, 2 * CONFIG.floorY - worldPos.y, worldPos.z);
    reflectionCube.quaternion.copy(worldQuat);
    reflectionCube.scale.set(cube.scale.x, -cube.scale.y, cube.scale.z);
  }

  /* ------------------------------------------------------------ */
  /*  Hover glow — additive sprite, cheap and reliable "bloom"      */
  /* ------------------------------------------------------------ */
  function createGlowTexture() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.4, 'rgba(255,255,255,0.35)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  }
  const glowSprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: createGlowTexture(),
      color: CONFIG.hover.glowColor,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  glowSprite.scale.set(3.2, 3.2, 1);
  tiltGroup.add(glowSprite);

  /* ------------------------------------------------------------ */
  /*  Interaction — cursor tilt, camera parallax, hover response    */
  /*  All eased with GSAP quickTo/to for smooth, non-abrupt motion  */
  /* ------------------------------------------------------------ */
  const pointer = new THREE.Vector2();
  const raycaster = new THREE.Raycaster();
  let hovered = false;

  const setTiltX = gsap.quickTo(tiltGroup.rotation, 'x', { duration: CONFIG.tilt.duration, ease: 'power3.out' });
  const setTiltY = gsap.quickTo(tiltGroup.rotation, 'y', { duration: CONFIG.tilt.duration, ease: 'power3.out' });
  const setCamX = gsap.quickTo(camera.position, 'x', { duration: CONFIG.camera.duration, ease: 'power3.out' });
  const setCamY = gsap.quickTo(camera.position, 'y', { duration: CONFIG.camera.duration, ease: 'power3.out' });

  function onPointerMove(event) {
    pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

    setTiltY(pointer.x * CONFIG.tilt.strength);
    setTiltX(-pointer.y * CONFIG.tilt.strength);

    setCamX(pointer.x * CONFIG.camera.parallax);
    setCamY(0.4 + pointer.y * CONFIG.camera.parallax * 0.6);

    raycaster.setFromCamera(pointer, camera);
    const isHit = raycaster.intersectObject(cube).length > 0;

    if (isHit && !hovered) {
      hovered = true;
      document.body.style.cursor = 'pointer';
      gsap.to(cube.scale, { x: CONFIG.hover.scale, y: CONFIG.hover.scale, z: CONFIG.hover.scale, duration: 0.5, ease: 'power3.out' });
      gsap.to(cubeMaterial, { emissiveIntensity: CONFIG.hover.glowIntensity, duration: 0.5, ease: 'power2.out' });
      gsap.to(glowSprite.material, { opacity: 0.8, duration: 0.5, ease: 'power2.out' });
      gsap.to(glowSprite.scale, { x: 4, y: 4, duration: 0.5, ease: 'power2.out' });
    } else if (!isHit && hovered) {
      hovered = false;
      document.body.style.cursor = 'auto';
      gsap.to(cube.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: 'power3.out' });
      gsap.to(cubeMaterial, { emissiveIntensity: 0, duration: 0.6, ease: 'power2.out' });
      gsap.to(glowSprite.material, { opacity: 0, duration: 0.6, ease: 'power2.out' });
      gsap.to(glowSprite.scale, { x: 3.2, y: 3.2, duration: 0.6, ease: 'power2.out' });
    }
  }
  window.addEventListener('pointermove', onPointerMove);

  /* ------------------------------------------------------------ */
  /*  Animation loop — float + auto-spin run continuously; tilt/    */
  /*  hover are driven separately by GSAP above                     */
  /* ------------------------------------------------------------ */
  const clock = new THREE.Clock();
  const phase = Math.random() * Math.PI * 2;
  let elapsed = 0;

  function animate() {
    const delta = clock.getDelta();
    elapsed += delta;

    floatGroup.position.y = Math.sin(elapsed * CONFIG.cube.floatSpeed + phase) * CONFIG.cube.floatAmplitude;
    cube.rotation.y += delta * CONFIG.cube.rotationSpeed;
    cube.rotation.x = Math.sin(elapsed * CONFIG.cube.floatSpeed * 0.5) * 0.08;

    syncReflection();
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  /* ------------------------------------------------------------ */
  /*  Resize                                                        */
  /* ------------------------------------------------------------ */
  window.addEventListener('resize', () => {
    const { innerWidth: w, innerHeight: h } = window;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
</body>
</html>
